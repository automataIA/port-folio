<!-- @dsCard group="Rows" viewport="1280x1600" name="Experience item" subtitle="Ruolo, azienda, periodo, 2-4 bullet, tag stack" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light');</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<title>Experience item</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.6;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
.w{max-width:var(--max);margin:0 auto;padding:36px 28px 80px}
h1{font-family:var(--mono);font-weight:500;font-size:20px;letter-spacing:-.02em;margin-bottom:6px}
.lede{color:var(--fg2);font-size:14px;max-width:74ch;margin-bottom:8px}
h2{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--fg3);margin:34px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px}
.note{font-size:12.5px;color:var(--fg3);margin:-4px 0 10px}
</style></head><body>
<div class="w">
<h1>Experience item</h1>
<p class="lede">Ruolo, azienda, periodo, 2-4 bullet, tag stack</p>
<h2>Tre lunghezze</h2><div id="len"></div>
<h2>Campi opzionali assenti</h2><p class="note">Solo il ruolo: niente azienda, periodo, bullet o tag.</p><div id="min"></div>
<h2>Troncamento</h2><p class="note">Ogni bullet si ferma a 3 righe; oltre il quarto bullet il componente scarta.</p><div id="trunc"></div>
<h2>Sezione — 1 / 3 / 8 elementi</h2><div id="n1"></div><div style="height:20px"></div><div id="n3"></div><div style="height:20px"></div><div id="n8"></div>
<h2>Sezione vuota</h2><div id="empty"></div>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../demo-harness.js"></script>
<script>
var DS=window.Portfolio_53aeaf;
var E=DS.ExperienceItem, Empty=DS.EmptyState;
var mk=function(o){return h(E,o)};
dsMount('#len',wrap('stack-list',[
 h(E,{key:1,role:'ML Engineer',company:'Freelance',period:'2024 —',bullets:['Shipped a RAG service in Rust.'],stack:['Rust']}),
 h(E,{key:2,role:'Machine Learning Engineer',company:'Studio Autognosi',period:'2021 — 2024',bullets:['Built retrieval-augmented pipelines over 2M internal documents.','Cut inference cost 38% by moving embedding to WASM at the edge.','Mentored two junior engineers through their first production model.'],stack:['Rust','PyTorch','WASM','Postgres']}),
 h(E,{key:3,role:'Senior Machine Learning Engineer, Applied Research and Platform Reliability',company:'A very long organisation name that keeps going, Department of Applied Intelligence',period:'March 2019 — December 2021',bullets:['Designed and operated the company-wide feature store, replacing four team-local pipelines with one contract-tested service that now backs every production model and cut onboarding for a new model from three weeks to two days.','Led the migration of the training stack to a reproducible, container-first workflow with pinned datasets and deterministic seeds, which made regression triage possible for the first time.','Rewrote the nightly evaluation harness so that failures point at the offending slice rather than the aggregate metric.','Represented the team in the architecture review board and wrote the internal guidance on model rollback.'],stack:['Rust','Python','PyTorch','Kubernetes','Airflow','Feature Store','ONNX','Triton']})
]));
dsMount('#min',wrap('stack-list',[h(E,{key:1,role:'Independent Researcher'})]));
dsMount('#trunc',wrap('stack-list',[h(E,{key:1,role:'Research Engineer',company:'Lab',period:'2018 — 2019',bullets:['Pure-Rust data visualization library using Leptos and WebAssembly, with automatic Level of Detail management that renders datasets of tens of millions of points through LTTB and M4 downsampling, an incremental layout engine that recomputes only the viewport that changed, worker-based decoding so the main thread never blocks, and a plugin surface for custom marks, scales and interaction handlers — designed so a dashboard with forty live series stays at sixty frames per second on a laptop without a discrete GPU.','Second bullet, short.','Third.','Fourth.','Fifth bullet — dropped: the component keeps at most four.'],stack:['Rust']})]));
var one=function(i){return h(E,{key:i,role:'Machine Learning Engineer',company:'Company '+(i+1),period:(2018+i)+' — '+(2019+i),bullets:['Owned the retrieval stack end to end.','Reduced p95 latency from 480ms to 120ms.'],stack:['Rust','PyTorch','WASM']})};
dsMount('#n1',wrap('stack-list',repeat(1,one)));
dsMount('#n3',wrap('stack-list',repeat(3,one)));
dsMount('#n8',wrap('stack-list',repeat(8,one)));
dsMount('#empty',h(Empty,{label:'No experience listed',hint:'Roles appear here as soon as one is added.'}));
</script>
</body></html>
