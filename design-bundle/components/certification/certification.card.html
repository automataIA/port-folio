<!-- @dsCard group="Rows" viewport="1280x1400" name="Certification item" subtitle="Nome, ente, anno, badge opzionale" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light');</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<title>Certification item</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.6;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
.w{max-width:var(--max);margin:0 auto;padding:36px 28px 80px}
h1{font-family:var(--mono);font-weight:500;font-size:20px;letter-spacing:-.02em;margin-bottom:6px}
.lede{color:var(--fg2);font-size:14px;max-width:74ch;margin-bottom:8px}
h2{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--fg3);margin:34px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px}
.note{font-size:12.5px;color:var(--fg3);margin:-4px 0 10px}
</style></head><body>
<div class="w">
<h1>Certification item</h1>
<p class="lede">Nome, ente, anno, badge opzionale</p>
<h2>Tre lunghezze</h2><div id="len"></div>
<h2>Campi opzionali assenti</h2><p class="note">Nessun badge, nessun ente, nessun anno.</p><div id="min"></div>
<h2>Griglia — 1 / 3 / 8 elementi</h2><div id="n1"></div><div style="height:20px"></div><div id="n3"></div><div style="height:20px"></div><div id="n8"></div>
<h2>Sezione vuota</h2><div id="empty"></div>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../demo-harness.js"></script>
<script>
var DS=window.Portfolio_53aeaf;
var C=DS.CertificationItem, Empty=DS.EmptyState;
dsMount('#len',wrap('card-grid',[
 h(C,{key:1,name:'TensorFlow Developer',issuer:'Google',year:2022,badge:'Professional'}),
 h(C,{key:2,name:'Deep Learning Specialization',issuer:'DeepLearning.AI on Coursera',year:2021}),
 h(C,{key:3,name:'Professional Machine Learning Engineer — design, build, productionize and monitor machine learning models on managed infrastructure',issuer:'Google Cloud, Certification Program for Data and Machine Learning Practitioners',year:'2023',badge:'Associate'})
]));
dsMount('#min',wrap('card-grid',[h(C,{key:1,name:'Rust Foundations'})]));
var one=function(i){return h(C,{key:i,name:'Certification '+(i+1),issuer:'Issuing body '+(i+1),year:2018+i,badge:i%3?null:'Professional'})};
dsMount('#n1',wrap('card-grid',repeat(1,one)));
dsMount('#n3',wrap('card-grid',repeat(3,one)));
dsMount('#n8',wrap('card-grid',repeat(8,one)));
dsMount('#empty',h(Empty,{label:'No certifications',hint:'Credentials appear here once earned.'}));
</script>
</body></html>
