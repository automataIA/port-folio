<!-- @dsCard group="Rows" viewport="1280x1400" name="Publication item" subtitle="Titolo, venue, anno, link" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light');</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<title>Publication item</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.6;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
.w{max-width:var(--max);margin:0 auto;padding:36px 28px 80px}
h1{font-family:var(--mono);font-weight:500;font-size:20px;letter-spacing:-.02em;margin-bottom:6px}
.lede{color:var(--fg2);font-size:14px;max-width:74ch;margin-bottom:8px}
h2{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--fg3);margin:34px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px}
.note{font-size:12.5px;color:var(--fg3);margin:-4px 0 10px}
</style></head><body>
<div class="w">
<h1>Publication item</h1>
<p class="lede">Titolo, venue, anno, link</p>
<h2>Tre lunghezze</h2><div id="len"></div>
<h2>Campi opzionali assenti</h2><p class="note">Solo il titolo.</p><div id="min"></div>
<h2>Sezione — 1 / 3 / 8 elementi</h2><div id="n1"></div><div style="height:20px"></div><div id="n3"></div><div style="height:20px"></div><div id="n8"></div>
<h2>Sezione vuota</h2><div id="empty"></div>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../demo-harness.js"></script>
<script>
var DS=window.Portfolio_53aeaf;
var Pb=DS.PublicationItem, Empty=DS.EmptyState;
dsMount('#len',wrap('stack-list',[
 h(Pb,{key:1,title:'Sparse retrieval, revisited',venue:'arXiv',year:2025,url:'#'}),
 h(Pb,{key:2,title:'Level-of-detail strategies for browser-side visualization of very large time series',venue:'Journal of Visualization and Interaction, vol. 14',year:2024,url:'#'}),
 h(Pb,{key:3,title:'A reproducibility protocol for retrieval-augmented generation systems: dataset pinning, deterministic seeds, slice-level evaluation and the reporting conventions required to make results comparable across laboratories and hardware generations',venue:'Proceedings of the International Workshop on Reproducible Machine Learning Systems, Association for Computing Machinery',year:'2023',url:'#'})
]));
dsMount('#min',wrap('stack-list',[h(Pb,{key:1,title:'Notes on embedding drift'})]));
var one=function(i){return h(Pb,{key:i,title:'Retrieval note #'+(i+1)+': measuring recall under distribution shift',venue:'arXiv',year:2020+i,url:'#'})};
dsMount('#n1',wrap('stack-list',repeat(1,one)));
dsMount('#n3',wrap('stack-list',repeat(3,one)));
dsMount('#n8',wrap('stack-list',repeat(8,one)));
dsMount('#empty',h(Empty,{label:'No publications',hint:'Papers and preprints appear here.'}));
</script>
</body></html>
